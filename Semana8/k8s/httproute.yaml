# Regla de enrutamiento HTTP conectada al Gateway
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: api-route
  namespace: mumnk8s
spec:
  # Vincula esta ruta con el Gateway api-gateway
  parentRefs:
    - name: api-gateway
  rules:
    # Regla para capturar peticiones con prefijo de ruta /
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Redirige el trafico capturado hacia el Service de Kubernetes
      backendRefs:
        - name: api-rust-service
          port: 80