apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  clusterIP: None            # headless: requerido por el StatefulSet
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: valkey
      port: {{ .Values.service.port }}
      targetPort: 6379
